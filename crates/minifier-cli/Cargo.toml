[package]
name = "minifier-cli"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.25"
minifier = { path = "../minifier" }
minifier-utils = { path = "../minifier-utils" }
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4"
anyhow = "1.0.104"
