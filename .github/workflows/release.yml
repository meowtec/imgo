name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Resolve tag
        id: ref
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}

      - name: Validate versions
        id: metadata
        shell: bash
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          app_version="$(jq -r '.version' app/package.json)"
          if [[ "$TAG" != "v$app_version" ]]; then
            echo "Version mismatch: tag=$TAG app=$app_version" >&2
            exit 1
          fi

          version="$app_version"
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  prepare-app:
    name: Prepare app bindings
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          submodules: recursive

      - uses: pnpm/setup@2270f39ef63c3edf50be34da68c039eca5e15c15 # v2.1.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Apply native source patches
        run: pnpm run init:src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: shared-js-${{ hashFiles('deps/*.patch') }}
          workspaces: . -> target

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build shared JS bindings
        run: pnpm run rsts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-js-${{ needs.metadata.outputs.version }}
          path: crates/shared-js/pkg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-desktop:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: [metadata, prepare-app]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_arch: amd64
            bundle: deb,rpm,appimage
            expected_artifacts: 4
            artifact: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/flatpak/*.flatpak
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_arch: arm64
            bundle: deb,rpm,appimage
            expected_artifacts: 4
            artifact: |
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/aarch64-unknown-linux-gnu/release/bundle/flatpak/*.flatpak
          - os: windows
            arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
            expected_artifacts: 2
            artifact: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              target/x86_64-pc-windows-msvc/release/bundle/portable/*_portable.zip
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
            expected_artifacts: 2
            artifact: |
              target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              target/aarch64-pc-windows-msvc/release/bundle/portable/*_portable.zip
          - os: macos
            arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            expected_artifacts: 1
            artifact: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            expected_artifacts: 1
            artifact: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            file \
            flatpak \
            flatpak-builder \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            nasm \
            ninja-build \
            patchelf \
            pkg-config \
            rpm

          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49

      - name: Ensure macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ninja >/dev/null 2>&1 || brew install ninja
          # libaom's test_nasm() runs `nasm -hf` and greps for -Ox. That check
          # rejects NASM < 2.14 (no -Ox) and NASM >= 3.0 (its -hf shows topic
          # help, so the -Ox line no longer appears), so the Homebrew nasm
          # (3.x) fails the aom build. Build the last compatible release,
          # 2.16.03, from source (homebrew-core ships only `nasm` at 3.x;
          # there is no versioned `nasm@2` formula).
          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]] && ! nasm -v 2>/dev/null | grep -q '^NASM version 2\.'; then
            curl -fsSL "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.gz" -o /tmp/nasm-2.16.03.tar.gz
            echo "5bc940dd8a4245686976a8f7e96ba9340a0915f2d5b88356874890e207bdb581  /tmp/nasm-2.16.03.tar.gz" | shasum -a 256 -c -
            tar -xzf /tmp/nasm-2.16.03.tar.gz -C /tmp
            cd /tmp/nasm-2.16.03
            ./configure
            make -j"$(sysctl -n hw.ncpu)"
            sudo make install
            nasm -v
          fi

      - name: Verify Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          ninja --version

      - uses: pnpm/setup@2270f39ef63c3edf50be34da68c039eca5e15c15 # v2.1.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Apply native source patches
        run: pnpm run init:src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('deps/*.patch') }}
          workspaces: . -> target

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-js-${{ needs.metadata.outputs.version }}
          path: crates/shared-js/pkg

      - name: Build minifier JS wrapper
        run: pnpm --filter @imgo/minifier-js build

      - name: Build desktop bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm --dir app tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Build Windows portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $bundleDir = "target/$env:TARGET/release/bundle/portable"
          $portableName = "IMGo_{0}_{1}" -f $env:VERSION, $env:ARCH
          $portableDir = "$bundleDir/$portableName"

          New-Item -ItemType Directory -Force -Path "$portableDir/i18n" | Out-Null
          Copy-Item "target/$env:TARGET/release/IMGo.exe" "$portableDir/IMGo.exe"
          Copy-Item "app/src-tauri/i18n/*" "$portableDir/i18n"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "$bundleDir/${portableName}_portable.zip"

      - name: Build Flatpak bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          staging="packaging/flatpak/.build"
          bundle_dir="target/$TARGET/release/bundle/flatpak"

          rm -rf "$staging" flatpak-build flatpak-repo
          mkdir -p "$staging" "$bundle_dir"
          install -m755 "target/$TARGET/release/IMGo" "$staging/IMGo"
          install -m644 app/src-tauri/icons/icon.png "$staging/icon.png"
          install -m644 packaging/flatpak/com.meowtec.imgo.desktop "$staging/"
          install -m644 packaging/flatpak/com.meowtec.imgo.metainfo.xml "$staging/"
          cp -R app/src-tauri/i18n "$staging/i18n"

          flatpak-builder \
            --user \
            --force-clean \
            --disable-rofiles-fuse \
            --default-branch=stable \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/com.meowtec.imgo.yml
          flatpak build-bundle \
            flatpak-repo \
            "$bundle_dir/IMGo_${VERSION}_${PACKAGE_ARCH}.flatpak" \
            com.meowtec.imgo \
            stable

      - name: Validate desktop artifacts
        shell: bash
        env:
          ARTIFACT_GLOBS: ${{ matrix.artifact }}
          EXPECTED_ARTIFACTS: ${{ matrix.expected_artifacts }}
        run: |
          shopt -s nullglob
          files=()
          while IFS= read -r pattern; do
            mapfile -t matches < <(compgen -G "$pattern" || true)
            files+=("${matches[@]}")
          done <<< "$ARTIFACT_GLOBS"

          if [[ "${#files[@]}" -ne "$EXPECTED_ARTIFACTS" ]]; then
            echo "Expected $EXPECTED_ARTIFACTS desktop artifacts, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: IMGo-${{ needs.metadata.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [metadata, build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: IMGo-${{ needs.metadata.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: IMGo ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'false' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
