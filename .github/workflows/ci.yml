name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.4
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1

jobs:
  check:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake nasm ninja-build pkg-config

      - uses: pnpm/setup@2270f39ef63c3edf50be34da68c039eca5e15c15 # v2.1.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown,wasm32-unknown-emscripten

      - name: Apply native source patches
        run: pnpm run init:src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build shared JS bindings
        run: pnpm run rsts

      - name: Build minifier JS wrapper
        run: pnpm --filter @imgo/minifier-js build

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: |
          pnpm --filter @imgo/minifier-js build:wasm
          pnpm --filter @imgo/web build

      - name: Test
        run: pnpm test
