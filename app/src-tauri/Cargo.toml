[package]
name = "IMGo"
version = "0.1.0"
description = "A Tauri App"
authors = ["meowtec"]
license = ""
repository = ""
default-run = "IMGo"
edition = "2021"
rust-version = "1.83"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
lazy_static = "1.4"
image = { version = "0.25" }
md5 = "0.8.1"
hex = "0.4"
sys-locale = "0.3"
log = "0.4"
tauri-plugin-log = { version = "2.9.0" }
once_cell = "1.21.4"
sha2 = "0.10.8"
anyhow = "1.0.104"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
walkdir = "2"

minifier = { path = "../../crates/minifier" }
minifier-utils = { path = "../../crates/minifier-utils" }
nanoid = "0.5.0"
ts-rs = "12.0.1"
tauri-plugin-single-instance = "2"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
release-devtools = ["tauri/devtools"]
